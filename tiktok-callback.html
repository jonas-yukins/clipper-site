<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connecting TikTok · Clipper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main" class="wrap prose">
    <h1>Connecting your TikTok account…</h1>
    <p id="msg">Finishing sign-in.</p>
  </main>
  <script>
    // TikTok redirects here after the account owner approves Clipper. Clipper's sign-in helper runs on the
    // owner's own computer and listens on 127.0.0.1; it puts its port in `state` ("p<port>-<random>"), so
    // this page hands the one-time code straight to it. Nothing is stored or sent anywhere else.
    (function () {
      var q = new URLSearchParams(location.search);
      var state = q.get("state") || "";
      var m = /^p(\d{4,5})-[A-Za-z0-9_-]+$/.exec(state);
      var msg = document.getElementById("msg");
      if (q.get("error")) {
        msg.textContent = "TikTok sign-in was cancelled or failed: " + (q.get("error_description") || q.get("error"));
      } else if (m && q.get("code")) {
        location.replace("http://127.0.0.1:" + m[1] + "/callback" + location.search);
      } else {
        msg.textContent = "This page completes TikTok sign-in for Clipper. Start the connection from Clipper.";
      }
    })();
  </script>
</body>
</html>
